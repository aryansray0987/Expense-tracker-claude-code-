{% extends "base.html" %}

{% block title %}{{ heading }} — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">{{ heading }}</h1>
            <p class="auth-subtitle">Amounts are in rupees (₹)</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ action }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="0.00"
                           step="0.01" min="0.01" inputmode="decimal"
                           value="{{ values.amount or '' }}"
                           required autofocus>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {{ "selected" if not values.category }}>Choose a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {{ "selected" if values.category == cat }}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" max="{{ today }}"
                           value="{{ values.date or '' }}"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="label-optional">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Groceries at the market"
                           maxlength="200"
                           value="{{ values.description or '' }}">
                </div>

                <button type="submit" class="btn-submit">{{ submit_label }}</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">← Back to profile</a>
            {% if delete_url %}
            <span class="auth-switch-sep">·</span>
            <a href="{{ delete_url }}" class="link-danger">Delete this expense</a>
            {% endif %}
        </p>

    </div>
</section>

{% endblock %}
